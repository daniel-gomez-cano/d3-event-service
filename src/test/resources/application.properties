spring.datasource.url=jdbc:h2:mem:eventdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
spring.profiles.active=test

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

#si tienes un docker-compose.yml con todos los servicios en la misma red, 
#la respuesta es sí. Si Keycloak corre en otro host o no está en tu compose, 
#necesitarás configurar la URL correctamente
jwk-set-uri: http://<keycloak-host>/realms/<tu-realm>/protocol/openid-connect/certs
