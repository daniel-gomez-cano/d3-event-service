# ================================================================
# VIVAEVENTOS - Event Service
# application.properties
# ================================================================
# IMPORTANTE: No subir este archivo con valores reales al repo.
# Usar variables de entorno para todos los valores sensibles.
# Ver .env.example para la lista de variables requeridas.
# ================================================================


# ?? Servidor ?????????????????????????????????????????????????????
server.port=8081
server.servlet.context-path=/


# ?? Aplicacion ???????????????????????????????????????????????????
spring.application.name=event-service


# ?? Base de datos (PostgreSQL) ???????????????????????????????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (HikariCP ? incluido con Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000


# ?? JPA / Hibernate ??????????????????????????????????????????????
# validate: verifica que el esquema DB coincide con las entidades
# update : actualiza el esquema automaticamente (solo desarrollo)
# none   : no toca el esquema (produccion)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Herencia JOINED: necesario para que Hibernate genere los JOINs correctos
spring.jpa.properties.hibernate.use_sql_comments=true


# ?? Keycloak / OAuth2 Resource Server ????????????????????????????
# URL del realm de Keycloak. Spring descarga automaticamente las
# claves publicas JWKS desde: {issuer-uri}/.well-known/openid-configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# Alternativa si se prefiere apuntar directo al endpoint JWKS:
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}


# ?? Actuator (health check para Docker y monitoreo) ??????????????
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=VivaEventos - Event Service
info.app.version=1.0.0


# ?? Logs ?????????????????????????????????????????????????????????
logging.level.root=INFO
logging.level.com.vivaeventos=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Formato de logs (util para leer en consola durante desarrollo)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# ?? Jackson (serializacion JSON) ?????????????????????????????????
# No serializar campos null en las respuestas
spring.jackson.default-property-inclusion=non_null
# Formato de fechas ISO 8601 en lugar de timestamps numericos
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota


# ?? Validacion ???????????????????????????????????????????????????
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false